services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # Sobrescribimos URLs para que apunten a los contenedores
      - POSTGRES_URL=postgresql://user:password@postgres:5432/carpinteria
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      - LANGGRAPH_ALLOW_MODULES=api.schemas.estimate
      - UPLOAD_DIR=/app/uploads
    volumes:
      - ./backend:/app          # código fuente en vivo — cambios sin reconstruir
      - uploads_data:/app/uploads
    depends_on:
      - postgres
      - chroma
    networks:
      - app-network

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: carpinteria
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  chroma:
    image: chromadb/chroma:latest
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/data
    networks:
      - app-network

volumes:
  postgres_data:
  chroma_data:
  uploads_data:

networks:
  app-network:
    driver: bridge
